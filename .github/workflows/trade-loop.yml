name: 24/7 Delphi Agent Arena Automated Trader

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Delphi Agent Arena Trade Run
        env:
          DELPHI_NETWORK: competition-testnet
          DELPHI_SIGNER_TYPE: private_key
          WALLET_PRIVATE_KEY: ${{ secrets.WALLET_PRIVATE_KEY }}
          DELPHI_API_ACCESS_KEY: ${{ secrets.DELPHI_API_ACCESS_KEY }}
          MIN_EDGE_THRESHOLD: '0.01'
          MAX_KELLY_FRACTION: '0.80'
          MAX_EXPOSURE_PER_MARKET: '1000'
          MAX_DAILY_EXPOSURE: '3000'
        run: npm run trade
